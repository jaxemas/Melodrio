<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melodrio – Prezentace po 1. Fázi vývoje (5-10 min)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090D16;
      --card-bg: #131B2E;
      --card-border: #334155;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #6366F1;
      --emerald: #10B981;
      --amber: #F59E0B;
      --rose: #F43F5E;
      --cyan: #38BDF8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Control Bar */
    header.pres-header {
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.65rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }
    .brand-badge {
      background: linear-gradient(135deg, #4F46E5, #06B6D4);
      color: #fff;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .pres-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .ctrl-btn {
      background: #1E293B;
      color: #F8FAFC;
      border: 1px solid #475569;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .ctrl-btn:hover {
      background: #334155;
      border-color: #64748B;
    }
    .ctrl-btn.active {
      background: #4F46E5;
      border-color: #6366F1;
      color: white;
    }
    .timer-badge {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      border: 1px solid #334155;
      color: #38BDF8;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* Presentation Container */
    main.pres-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    .slide-stage {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      background: #0D1424;
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 20px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px -10px rgba(79, 70, 229, 0.2);
      display: flex;
      flex-direction: column;
      padding: 2.25rem 2.75rem;
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .slide-top-glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }

    .slide-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .slide-pill {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      color: white;
      display: inline-block;
    }
    .slide-num-indicator {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .slide-header {
      margin-bottom: 1.4rem;
    }
    .slide-title {
      font-size: 1.95rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: #FFFFFF;
      margin-bottom: 0.35rem;
    }
    .slide-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Slide Layouts */
    .slide-body {
      flex: 1;
      display: flex;
      gap: 1.25rem;
    }

    .slide-card {
      flex: 1;
      background: #131B2E;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem 1.4rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .slide-card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .slide-card ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .slide-card li {
      font-size: 0.92rem;
      color: #CBD5E1;
      line-height: 1.45;
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
    }
    .slide-card li::before {
      content: "-";
      color: var(--cyan);
      font-weight: bold;
      margin-right: 0.25rem;
      flex-shrink: 0;
    }

    /* Hero Layout (Slide 1) */
    .hero-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.5), rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 18px;
      padding: 2rem;
    }
    .hero-logo {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #818CF8, #38BDF8, #34D399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .hero-tagline {
      font-size: 1.45rem;
      font-weight: 700;
      color: white;
      margin-bottom: 1rem;
    }
    .hero-desc {
      font-size: 1.05rem;
      color: #94A3B8;
      max-width: 750px;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .hero-badges {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .hero-badge-item {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #475569;
      padding: 0.4rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #E2E8F0;
    }

    /* Footer Nav */
    footer.pres-footer {
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid var(--card-border);
      padding: 0.75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .slide-dots {
      display: flex;
      gap: 0.45rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background: #334155;
      cursor: pointer;
      transition: all 0.2s;
    }
    .dot.active {
      background: #6366F1;
      width: 24px;
    }

    @media (max-width: 900px) {
      .slide-stage { aspect-ratio: auto; min-height: 600px; padding: 1.5rem; }
      .slide-body { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="pres-header">
    <div class="brand">
      <span>🎸 Melodrio</span>
      <span class="brand-badge">1. FÁZE ZE 3</span>
    </div>

    <div class="pres-controls">
      <div class="timer-badge" id="timerBadge">⏱ 00:00</div>
      <button class="ctrl-btn" id="timerToggleBtn">▶ Start časovače</button>
      <a href="prezentace_melodrio_faze1.pptx" download class="ctrl-btn">📥 Stáhnout .PPTX</a>
      <button class="ctrl-btn" id="fullscreenBtn">⛶ Celá obrazovka</button>
    </div>
  </header>

  <!-- Slide Viewport -->
  <main class="pres-viewport">
    <div class="slide-stage" id="slideStage">
      <div class="slide-top-glow" id="slideGlow"></div>

      <div class="slide-meta-row">
        <span class="slide-pill" id="slidePill">ÚVODNÍ PREZENTACE</span>
        <span class="slide-num-indicator" id="slideNum">Slide 1 / 10</span>
      </div>

      <div class="slide-header" id="slideHeader">
        <h1 class="slide-title" id="slideTitle">MELODRIO</h1>
        <p class="slide-subtitle" id="slideSubtitle">Interaktivní kytarová akademie nové generace</p>
      </div>

      <div class="slide-body" id="slideBody">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </main>

  <!-- Bottom Nav -->
  <footer class="pres-footer">
    <button class="ctrl-btn" id="prevBtn">◀ Předchozí (←)</button>
    <div class="slide-dots" id="dotsContainer"></div>
    <button class="ctrl-btn" id="nextBtn">Další (→) ▶</button>
  </footer>

  <script>
    let currentSlide = 1;
    let timerSeconds = 0;
    let timerInterval = null;
    let slidesData = [];

    const slideStage = document.getElementById('slideStage');
    const slideGlow = document.getElementById('slideGlow');
    const slidePill = document.getElementById('slidePill');
    const slideNum = document.getElementById('slideNum');
    const slideTitle = document.getElementById('slideTitle');
    const slideSubtitle = document.getElementById('slideSubtitle');
    const slideBody = document.getElementById('slideBody');
    const dotsContainer = document.getElementById('dotsContainer');
    const timerBadge = document.getElementById('timerBadge');
    const timerToggleBtn = document.getElementById('timerToggleBtn');

    // Fetch clean JSON
    fetch('slides_data.json')
      .then(res => res.json())
      .then(data => {
        slidesData = data;
        initDots();
        renderSlide(1);
      })
      .catch(err => {
        console.error("Failed to load slides_data.json", err);
      });

    function initDots() {
      dotsContainer.innerHTML = '';
      for (let i = 1; i <= slidesData.length; i++) {
        const dot = document.createElement('div');
        dot.className = `dot ${i === 1 ? 'active' : ''}`;
        dot.title = `Přejít na slide ${i}`;
        dot.onclick = () => renderSlide(i);
        dotsContainer.appendChild(dot);
      }
    }

    function renderSlide(index) {
      if (!slidesData || slidesData.length === 0) return;
      if (index < 1 || index > slidesData.length) return;
      currentSlide = index;
      const data = slidesData[index - 1];

      // Update header
      slideGlow.style.background = '#' + data.badgeColor;
      slidePill.textContent = data.badgeText;
      slidePill.style.background = '#' + data.badgeColor;
      slideNum.textContent = `Slide ${data.slideNum} / ${slidesData.length}`;

      slideTitle.textContent = data.title;
      slideSubtitle.textContent = data.subtitle;

      // Update body
      if (data.type === "title") {
        slideBody.innerHTML = `
          <div class="hero-layout">
            <div class="hero-logo">${data.title}</div>
            <div class="hero-tagline">${data.subtitle}</div>
            <div class="hero-desc">${data.tagline}</div>
            <div class="hero-badges">
              <div class="hero-badge-item">${data.inspiration}</div>
            </div>
            <div style="color: #94A3B8; font-size: 0.9rem; margin-top: 0.5rem;">${data.meta}</div>
          </div>
        `;
      } else if (data.type === "threeCard") {
        slideBody.innerHTML = data.cards.map(c => `
          <div class="slide-card">
            <div class="slide-card-title" style="color: #${c.color}">${c.title}</div>
            <ul>
              ${c.bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
        `).join('');
      } else if (data.type === "twoCard") {
        slideBody.innerHTML = `
          <div class="slide-card">
            <div class="slide-card-title" style="color: #${data.card1.color}">${data.card1.title}</div>
            <ul>
              ${data.card1.bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
          <div class="slide-card">
            <div class="slide-card-title" style="color: #${data.card2.color}">${data.card2.title}</div>
            <ul>
              ${data.card2.bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      // Update dots
      document.querySelectorAll('.dot').forEach((dot, idx) => {
        dot.className = `dot ${idx + 1 === index ? 'active' : ''}`;
      });
    }

    // Timer controls
    function formatTime(s) {
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    timerToggleBtn.onclick = () => {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerToggleBtn.textContent = "▶ Pokračovat v čase";
        timerToggleBtn.classList.remove('active');
      } else {
        timerInterval = setInterval(() => {
          timerSeconds++;
          timerBadge.textContent = `⏱ ${formatTime(timerSeconds)}`;
          if (timerSeconds > 600) {
            timerBadge.style.color = '#EF4444';
          } else if (timerSeconds > 300) {
            timerBadge.style.color = '#F59E0B';
          }
        }, 1000);
        timerToggleBtn.textContent = "⏸ Pozastavit časovač";
        timerToggleBtn.classList.add('active');
      }
    };

    // Fullscreen
    document.getElementById('fullscreenBtn').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    // Navigation buttons
    document.getElementById('prevBtn').onclick = () => renderSlide(currentSlide - 1);
    document.getElementById('nextBtn').onclick = () => renderSlide(currentSlide + 1);

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        renderSlide(currentSlide + 1);
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        renderSlide(currentSlide - 1);
      } else if (e.key === "f" || e.key === "F") {
        document.getElementById('fullscreenBtn').click();
      }
    });
  </script>
</body>
</html>
