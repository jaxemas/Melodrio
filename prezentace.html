    let currentSlide = 1;
    let timerSeconds = 0;
    let timerInterval = null;

    const slideStage = document.getElementById('slideStage');
    const slideGlow = document.getElementById('slideGlow');
    const slidePill = document.getElementById('slidePill');
    const slideNum = document.getElementById('slideNum');
    const slideTitle = document.getElementById('slideTitle');
    const slideSubtitle = document.getElementById('slideSubtitle');
    const slideBody = document.getElementById('slideBody');
    const notesContent = document.getElementById('notesContent');
    const notesDrawer = document.getElementById('notesDrawer');
    const dotsContainer = document.getElementById('dotsContainer');
    const timerBadge = document.getElementById('timerBadge');
    const timerToggleBtn = document.getElementById('timerToggleBtn');

    // Init Dots
    for (let i = 1; i <= 10; i++) {
      const dot = document.createElement('div');
      dot.className = `dot ${i === 1 ? 'active' : ''}`;
      dot.title = `Přejít na slide ${i}`;
      dot.onclick = () => renderSlide(i);
      dotsContainer.appendChild(dot);
    }

    function renderSlide(index) {
      if (index < 1 || index > 10) return;
      currentSlide = index;
      const data = SLIDES_DATA[index - 1];

      // Update meta
      slideGlow.style.background = data.pillColor;
      slidePill.textContent = data.pill;
      slidePill.style.background = data.pillColor;
      slideNum.textContent = `Slide ${data.num} / 10`;

      slideTitle.textContent = data.title;
      slideSubtitle.textContent = data.subtitle;

      // Update body
      if (data.type === "hero") {
        slideBody.innerHTML = `
          <div class="hero-layout">
            <div class="hero-logo">MELODRIO</div>
            <div class="hero-tagline">${data.heroTagline}</div>
            <div class="hero-desc">${data.heroDesc}</div>
            <div class="hero-badges">
              ${data.badges.map(b => `<div class="hero-badge-item">${b}</div>`).join('')}
            </div>
          </div>
        `;
      } else if (data.type === "cards3") {
        slideBody.innerHTML = data.cards.map(c => `
          <div class="slide-card">
            <div class="slide-card-title" style="color: ${c.color}">${c.title}</div>
            <ul>
              ${c.bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
        `).join('');
      } else if (data.type === "cards2") {
        slideBody.innerHTML = `
          <div class="slide-card">
            <div class="slide-card-title" style="color: ${data.card1.color}">${data.card1.title}</div>
            <ul>
              ${data.card1.bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
          <div class="slide-card">
            <div class="slide-card-title" style="color: ${data.card2.color}">${data.card2.title}</div>
            <ul>
              ${data.card2.bullets.map(b => `<li>${b}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      // Update notes
      notesContent.innerHTML = data.speechNotes;

      // Update dots
      document.querySelectorAll('.dot').forEach((dot, idx) => {
        dot.className = `dot ${idx + 1 === index ? 'active' : ''}`;
      });
    }

    // Timer controls
    function formatTime(s) {
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    timerToggleBtn.onclick = () => {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        timerToggleBtn.textContent = "▶ Pokračovat v čase";
        timerToggleBtn.classList.remove('active');
      } else {
        timerInterval = setInterval(() => {
          timerSeconds++;
          timerBadge.textContent = `⏱ ${formatTime(timerSeconds)}`;
          if (timerSeconds > 600) {
            timerBadge.style.color = '#EF4444'; // Red if over 10 mins
          } else if (timerSeconds > 300) {
            timerBadge.style.color = '#F59E0B'; // Amber between 5-10 mins
          }
        }, 1000);
        timerToggleBtn.textContent = "⏸ Pozastavit časovač";
        timerToggleBtn.classList.add('active');
      }
    };

    // Notes toggle
    document.getElementById('notesToggleBtn').onclick = () => {
      notesDrawer.classList.toggle('open');
      document.getElementById('notesToggleBtn').classList.toggle('active');
    };

    // Fullscreen
    document.getElementById('fullscreenBtn').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    // Navigation buttons
    document.getElementById('prevBtn').onclick = () => renderSlide(currentSlide - 1);
    document.getElementById('nextBtn').onclick = () => renderSlide(currentSlide + 1);

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        renderSlide(currentSlide + 1);
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        renderSlide(currentSlide - 1);
      } else if (e.key === "f" || e.key === "F") {
        document.getElementById('fullscreenBtn').click();
      } else if (e.key === "n" || e.key === "N") {
        document.getElementById('notesToggleBtn').click();
      }
    });

    // Initial render
    renderSlide(1);
  </script>
